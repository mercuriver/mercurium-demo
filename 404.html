<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datum Hog — Local-first chart builder</title>

    <!-- Favicons / app icons. SVG is primary; the 32px PNG covers browsers
         without SVG-favicon support. apple-touch-icon + manifest icons are
         full-bleed (see public/ICONS.md). -->
    <link rel="icon" href="/mercurium-demo/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/mercurium-demo/favicon-32.png?v=2" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/mercurium-demo/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/mercurium-demo/site.webmanifest?v=2" />
    <meta name="theme-color" content="#06b6d4" />

    <!-- Canonical points at the bare origin: the SPA serves one shell and the
         per-route canonical is the home document. Host mirrors SITE_ORIGIN
         (src/config/site.ts). -->
    <link rel="canonical" href="https://datumhog.com/" />

    <!-- Baseline static SEO meta (English) — crawl-time defaults for the SPA shell. -->
    <meta
      name="description"
      content="Datum Hog is a free, local-first chart builder. Paste your data, pick a chart type, and download a publication-ready image — no code and no account required."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Datum Hog — Local-first chart builder" />
    <meta
      property="og:description"
      content="Build publication-ready charts in your browser. Your data never leaves your device."
    />
    <meta property="og:url" content="https://datumhog.com/" />
    <meta property="og:image" content="https://datumhog.com/og-image.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Datum Hog — Local-first chart builder" />
    <meta
      name="twitter:description"
      content="Build publication-ready charts in your browser. Your data never leaves your device."
    />
    <meta name="twitter:image" content="https://datumhog.com/og-image.png?v=2" />

    <!-- Structured data (WebApplication). Host mirrors SITE_ORIGIN (src/config/site.ts). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Datum Hog",
        "url": "https://datumhog.com/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "browserRequirements": "Requires a modern web browser with JavaScript",
        "description": "Free, local-first chart builder. Paste your data, pick a chart type, map your series, and download a publication-ready image — no code and no account required.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- AdSense ownership verification. Meta tag on purpose (verification only,
         never serves ads) — rationale in docs/deployment/spec/ad-integration.md. -->
    <meta name="google-adsense-account" content="ca-pub-9431872905077219" />

    <!-- Analytics (GA4 / Clarity) load at runtime after cookie consent —
         see src/analytics/load-analytics.ts. Static loading would set
         tracking cookies before consent. -->
    <script type="module" crossorigin src="/mercurium-demo/assets/index-ZjEWdFA-.js"></script>
    <link rel="modulepreload" crossorigin href="/mercurium-demo/assets/vendor-react-DcsKhtWL.js">
    <link rel="modulepreload" crossorigin href="/mercurium-demo/assets/vendor-sentry-CALquetK.js">
    <link rel="modulepreload" crossorigin href="/mercurium-demo/assets/chart-CJEHJugW.js">
    <link rel="stylesheet" crossorigin href="/mercurium-demo/assets/index-B53ksxvr.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
