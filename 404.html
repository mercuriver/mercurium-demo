<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datum Hog — Local-first chart builder</title>

    <!-- Favicons / app icons. SVG is primary; the 32px PNG covers browsers
         without SVG-favicon support. apple-touch-icon + manifest icons are
         full-bleed (see public/ICONS.md). -->
    <link rel="icon" href="/mercurium-demo/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/mercurium-demo/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/mercurium-demo/apple-touch-icon.png" />
    <link rel="manifest" href="/mercurium-demo/site.webmanifest" />
    <meta name="theme-color" content="#06b6d4" />

    <!-- Canonical points at the bare origin: the SPA serves one shell and the
         per-route canonical is the home document. Host mirrors SITE_ORIGIN
         (src/config/site.ts). -->
    <link rel="canonical" href="https://datumhog.com/" />

    <!--
      Baseline static SEO meta (English). The SPA renders one HTML shell, so
      these are the crawl-time defaults. Per-locale dynamic meta is tracked
      separately (ST-26).
    -->
    <meta
      name="description"
      content="Datum Hog is a free, local-first chart builder. Paste your data, pick a chart type, and download a publication-ready image — no code and no account required."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Datum Hog — Local-first chart builder" />
    <meta
      property="og:description"
      content="Build publication-ready charts in your browser. Your data never leaves your device."
    />
    <meta property="og:url" content="https://datumhog.com/" />
    <meta property="og:image" content="https://datumhog.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Datum Hog — Local-first chart builder" />
    <meta
      name="twitter:description"
      content="Build publication-ready charts in your browser. Your data never leaves your device."
    />
    <meta name="twitter:image" content="https://datumhog.com/og-image.png" />

    <!--
      Structured data. WebApplication so search engines can surface Datum Hog as
      a tool (free, browser-based). offers/price 0 marks it free. Host matches
      SITE_ORIGIN (src/config/site.ts) — update both on the domain move.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Datum Hog",
        "url": "https://datumhog.com/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "browserRequirements": "Requires a modern web browser with JavaScript",
        "description": "Free, local-first chart builder. Paste your data, pick a chart type, map your series, and download a publication-ready image — no code and no account required.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!--
      Google AdSense site-ownership / review snippet. Loaded statically (not
      consent-gated) because AdSense's crawler must see it on every page to
      verify ownership and assess the site for review. This only registers the
      publisher account; actual ad units (<ins class="adsbygoogle">) are added
      to the editor surface separately, after review approval.
      TODO (post-approval): gate ad personalization behind cookie consent (CMP)
      the same way GA4 / Clarity are — see src/analytics/load-analytics.ts.
    -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9431872905077219"
      crossorigin="anonymous"
    ></script>

    <!--
      Analytics (GA4 + Microsoft Clarity) are NOT loaded here. They are injected
      at runtime only after the user accepts the cookie banner — see
      src/analytics/load-analytics.ts and src/context/consent-context.tsx.
      Loading them statically here would set tracking cookies before consent.
    -->
    <script type="module" crossorigin src="/mercurium-demo/assets/index-DBR6PbPr.js"></script>
    <link rel="modulepreload" crossorigin href="/mercurium-demo/assets/vendor-react-DcsKhtWL.js">
    <link rel="modulepreload" crossorigin href="/mercurium-demo/assets/vendor-d3-VQWL-TaJ.js">
    <link rel="modulepreload" crossorigin href="/mercurium-demo/assets/chart-obnvzneC.js">
    <link rel="modulepreload" crossorigin href="/mercurium-demo/assets/vendor-sentry-CALquetK.js">
    <link rel="stylesheet" crossorigin href="/mercurium-demo/assets/index-P0NYfQuG.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
